<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f7f9fc;
      color: #333;
    }
    .container {
      text-align: center;
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }
    h1 {
      margin-bottom: 1.5rem;
      font-size: 2rem;
    }
    button {
      background-color: #0070f3;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }
    button:hover {
      background-color: #005bb5;
    }
    button:active {
      transform: scale(0.98);
    }
    #message {
      margin-top: 1.25rem;
      font-size: 1.1rem;
      font-weight: 500;
      color: #0070f3;
      min-height: 1.5em;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hello, World!</h1>
    <button id="btn" onclick="handleClick()">Click Me</button>
    <div id="message"></div>
  </div>

  <script>
    function handleClick() {
      const msg = document.getElementById('message');
      msg.textContent = 'Button clicked! Welcome to the page.';
    }
  </script>
</body>
</html>
