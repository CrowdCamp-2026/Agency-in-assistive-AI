name: Deploy branch demos to GitHub Pages

# Rebuild whenever any branch is pushed or deleted so reviewers
# always see every branch's pages in one place.
on:
  push:
  delete:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (all branches)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build multi-branch preview site
        run: python3 .github/scripts/build_pages_site.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
